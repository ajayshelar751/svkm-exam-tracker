<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVKM's CED — Examination Activity & Multi-Level Verification Portal</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('svkm_theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Local High-Performance Standalone SheetJS Engine -->
  <script src="/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans antialiased text-slate-900 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <!-- Fallback guidance if index.html is opened directly via file:// instead of http://localhost:3000 -->
  <script>
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = [
            '<div style="font-family: system-ui, -apple-system, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; background: #0f172a; color: white; padding: 20px;">',
              '<div style="max-width: 560px; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center;">',
                '<div style="font-size: 40px; margin-bottom: 12px;">⚡</div>',
                '<h1 style="font-size: 19px; font-weight: bold; margin-bottom: 8px;">Vite Local Server Required</h1>',
                '<p style="font-size: 13px; color: #94a3b8; line-height: 1.6; margin-bottom: 20px;">',
                  'You are viewing this file directly via the <code>file://</code> protocol. Modern modular web applications require a local HTTP server.',
                '</p>',
                '<div style="background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 13px; color: #38bdf8; margin-bottom: 12px; text-align: left;">',
                  '> npm.cmd run dev',
                '</div>',
                '<p style="font-size: 12px; color: #64748b; margin-bottom: 24px;">',
                  'Then open <strong style="color: #e2e8f0;">http://localhost:3000</strong> in your browser.',
                '</p>',
                '<a href="./index.html.standalone.bak" style="display: inline-block; padding: 10px 22px; background: #4f46e5; color: white; text-decoration: none; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);">',
                  'Open Standalone Single-File Version →',
                '</a>',
              '</div>',
            '</div>'
          ].join('');
        }
      });
    }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
